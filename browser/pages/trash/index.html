<logic :if="canUseApp">
  <div class="mail-layout">
    <div class="mail-list-panel">
      <inbox-view_ :folder="'trash'" @select="mailSelected" />
    </div>
    <div class="mail-detail-panel">
      <logic :if="$selectedMail">
        <email-detail_ :email-id="$selectedMail" @back="mailDeselected" />
      </logic>
      <logic :if="!$selectedMail">
        <div class="mail-detail-empty">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;">
              <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>
            </svg>
            <p class="empty-state-title">No message selected</p>
            <p class="empty-state-subtitle">Choose a message from the list to read it here.</p>
          </div>
        </div>
      </logic>
    </div>
  </div>
</logic>
<logic :if="canShowLogin">
  <div class="login-screen"><login-form_ @login="window._hermes?.handleLogin($event.detail)" /></div>
</logic>
